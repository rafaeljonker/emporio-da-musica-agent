# Local dev database only; the credentials are a throwaway dev literal.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: emporio
      POSTGRES_DB: emporio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio -d emporio"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
