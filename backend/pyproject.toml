[project]
name = "emporio"
version = "0.1.0"
description = "Customer-service agent for Empório da Música (Artefact AI Engineer case)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
emporio = "emporio.entrypoints.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "modal>=1.6.3",
    "playwright>=1.64.1",
    "pre-commit>=4.7.0",
    "pytest-playwright>=0.10.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
load = ["locust>=2.47.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "BLE", "TRY", "DTZ", "S", "PT", "RET", "C4", "PIE", "PERF"]

[tool.ruff.lint.isort]
known-first-party = ["emporio", "tests", "evals"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN201"]
# The e2e server is started from fixed arguments (sys.executable, uvicorn), no untrusted input.
"**/e2e/conftest.py" = ["S603"]
# Deploy scripts run vllm/modal from fixed argument lists; vLLM must bind all interfaces in the container.
"**/deploy/*.py" = ["S603", "S607", "S104"]
# Load-test traffic picks messages at random; nothing here is security-sensitive.
"**/loadtest/*.py" = ["S311"]
# Runs ollama/docker from fixed argument lists; the tag comes from a fixed table.
"**/emporio/platform/local_model.py" = ["S603"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests", "evals"]
strict = ["src/emporio/*/domain", "src/emporio/*/application", "src/emporio/shared"]
reportMatchNotExhaustive = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not eval"]
markers = [
    "postgres: needs DATABASE_URL",
    "eval: real model, run by make evals",
]
pythonpath = ["."]

[tool.importlinter]
root_packages = ["emporio"]
include_external_packages = true

# When a new context is added, add it to EVERY contract below.
[[tool.importlinter.contracts]]
name = "catalog layers"
type = "layers"
layers = ["infrastructure", "application", "domain"]
containers = ["emporio.catalog"]

[[tool.importlinter.contracts]]
name = "orders layers"
type = "layers"
layers = ["infrastructure", "application", "domain"]
containers = ["emporio.orders"]

[[tool.importlinter.contracts]]
name = "policies layers"
type = "layers"
layers = ["infrastructure", "application", "domain"]
containers = ["emporio.policies"]

[[tool.importlinter.contracts]]
name = "support layers"
type = "layers"
layers = ["infrastructure", "application", "domain"]
containers = ["emporio.support"]

# Later phases: extend forbidden_modules as each dependency is added, if missing here.
[[tool.importlinter.contracts]]
name = "domain and shared stay framework-free"
type = "forbidden"
source_modules = [
    "emporio.catalog.domain", "emporio.orders.domain",
    "emporio.policies.domain", "emporio.support.domain", "emporio.shared",
]
forbidden_modules = [
    "fastapi", "langchain", "langchain_core", "langgraph", "sqlalchemy", "psycopg",
    "duckdb", "httpx", "openai", "anthropic", "google",
    "pydantic", "pydantic_settings", "langchain_openai", "langchain_google_genai",
    "langchain_anthropic", "langfuse", "fastmcp", "pandas", "requests", "rapidfuzz",
    "numpy", "fastembed", "pdfplumber", "pgvector", "psycopg_pool",
    "csv", "os", "pathlib", "sqlite3", "socket", "subprocess", "urllib", "http", "shutil",
    "tempfile", "glob", "io", "ssl", "smtplib", "asyncio", "threading", "logging",
]

[[tool.importlinter.contracts]]
name = "Application stays framework-free"
type = "forbidden"
source_modules = [
    "emporio.catalog.application", "emporio.orders.application",
    "emporio.policies.application", "emporio.support.application",
]
forbidden_modules = [
    "fastapi", "langchain", "langchain_core", "langgraph", "sqlalchemy", "psycopg",
    "duckdb", "httpx", "openai", "anthropic", "google",
    "pydantic", "pydantic_settings", "langchain_openai", "langchain_google_genai",
    "langchain_anthropic", "langfuse", "fastmcp", "pandas", "requests", "rapidfuzz",
    "numpy", "fastembed", "pdfplumber", "pgvector", "psycopg_pool",
]

[[tool.importlinter.contracts]]
name = "Domain and shared never import application or infrastructure"
type = "forbidden"
source_modules = [
    "emporio.catalog.domain", "emporio.orders.domain",
    "emporio.policies.domain", "emporio.support.domain", "emporio.shared",
]
forbidden_modules = [
    "emporio.catalog.application", "emporio.catalog.infrastructure",
    "emporio.orders.application", "emporio.orders.infrastructure",
    "emporio.policies.application", "emporio.policies.infrastructure",
    "emporio.support.application", "emporio.support.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Shared never imports a context"
type = "forbidden"
source_modules = ["emporio.shared"]
forbidden_modules = ["emporio.catalog", "emporio.orders", "emporio.policies", "emporio.support"]

[[tool.importlinter.contracts]]
name = "Application never imports any infrastructure"
type = "forbidden"
source_modules = [
    "emporio.catalog.application", "emporio.orders.application",
    "emporio.policies.application", "emporio.support.application",
]
forbidden_modules = [
    "emporio.catalog.infrastructure", "emporio.orders.infrastructure",
    "emporio.policies.infrastructure", "emporio.support.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Domains are independent of each other"
type = "independence"
modules = [
    "emporio.catalog.domain", "emporio.orders.domain",
    "emporio.policies.domain", "emporio.support.domain",
]

[[tool.importlinter.contracts]]
name = "Applications are independent of each other"
type = "independence"
modules = [
    "emporio.catalog.application", "emporio.orders.application",
    "emporio.policies.application", "emporio.support.application",
]

[[tool.importlinter.contracts]]
name = "Catalog application never imports another context's domain"
type = "forbidden"
source_modules = ["emporio.catalog.application"]
forbidden_modules = ["emporio.orders.domain", "emporio.policies.domain", "emporio.support.domain"]

[[tool.importlinter.contracts]]
name = "Orders application never imports another context's domain"
type = "forbidden"
source_modules = ["emporio.orders.application"]
forbidden_modules = ["emporio.catalog.domain", "emporio.policies.domain", "emporio.support.domain"]

[[tool.importlinter.contracts]]
name = "Policies application never imports another context's domain"
type = "forbidden"
source_modules = ["emporio.policies.application"]
forbidden_modules = ["emporio.catalog.domain", "emporio.orders.domain", "emporio.support.domain"]

[[tool.importlinter.contracts]]
name = "Support application never imports another context's domain"
type = "forbidden"
source_modules = ["emporio.support.application"]
forbidden_modules = ["emporio.catalog.domain", "emporio.orders.domain", "emporio.policies.domain"]

[[tool.importlinter.contracts]]
name = "Infrastructures are independent of each other"
type = "independence"
modules = [
    "emporio.catalog.infrastructure", "emporio.orders.infrastructure",
    "emporio.policies.infrastructure", "emporio.support.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Only infrastructure may use technical modules"
type = "forbidden"
source_modules = [
    "emporio.catalog.domain", "emporio.orders.domain",
    "emporio.policies.domain", "emporio.support.domain", "emporio.shared",
    "emporio.catalog.application", "emporio.orders.application",
    "emporio.policies.application", "emporio.support.application",
]
forbidden_modules = [
    "emporio.platform", "emporio.entrypoints",
]

[[tool.importlinter.contracts]]
name = "Platform never imports a context"
type = "forbidden"
source_modules = ["emporio.platform"]
forbidden_modules = ["emporio.catalog", "emporio.orders", "emporio.policies", "emporio.support"]

[[tool.importlinter.contracts]]
name = "Catalog infrastructure never imports another context's domain or application"
type = "forbidden"
source_modules = ["emporio.catalog.infrastructure"]
forbidden_modules = [
    "emporio.orders.domain", "emporio.orders.application",
    "emporio.policies.domain", "emporio.policies.application",
    "emporio.support.domain", "emporio.support.application",
]

[[tool.importlinter.contracts]]
name = "Orders infrastructure never imports another context's domain or application"
type = "forbidden"
source_modules = ["emporio.orders.infrastructure"]
forbidden_modules = [
    "emporio.catalog.domain", "emporio.catalog.application",
    "emporio.policies.domain", "emporio.policies.application",
    "emporio.support.domain", "emporio.support.application",
]

[[tool.importlinter.contracts]]
name = "Policies infrastructure never imports another context's domain or application"
type = "forbidden"
source_modules = ["emporio.policies.infrastructure"]
forbidden_modules = [
    "emporio.catalog.domain", "emporio.catalog.application",
    "emporio.orders.domain", "emporio.orders.application",
    "emporio.support.domain", "emporio.support.application",
]

[[tool.importlinter.contracts]]
name = "Support infrastructure never imports another context's domain or application"
type = "forbidden"
source_modules = ["emporio.support.infrastructure"]
forbidden_modules = [
    "emporio.catalog.domain", "emporio.catalog.application",
    "emporio.orders.domain", "emporio.orders.application",
    "emporio.policies.domain", "emporio.policies.application",
]
# Ruling R1: only the tool serializers and tools read other contexts' types
# (tools.base holds the use-case box; each tools module reads its own context's domain).
ignore_imports = [
    "emporio.support.infrastructure.agent.serializers -> emporio.catalog.domain.*",
    "emporio.support.infrastructure.agent.serializers -> emporio.orders.domain.*",
    "emporio.support.infrastructure.agent.serializers -> emporio.policies.domain.*",
    "emporio.support.infrastructure.agent.serializers -> emporio.policies.application.store_now",
    "emporio.support.infrastructure.agent.tools.base -> emporio.catalog.application.*",
    "emporio.support.infrastructure.agent.tools.base -> emporio.orders.application.*",
    "emporio.support.infrastructure.agent.tools.base -> emporio.policies.application.*",
    "emporio.support.infrastructure.agent.tools.catalog -> emporio.catalog.domain.*",
    "emporio.support.infrastructure.agent.tools.orders -> emporio.orders.domain.*",
]

[[tool.importlinter.contracts]]
name = "API stays on the application layer"
type = "forbidden"
source_modules = ["emporio.api"]
# Direct imports only: the application services api calls may read their own domain.
allow_indirect_imports = true
forbidden_modules = [
    "emporio.catalog.infrastructure", "emporio.orders.infrastructure",
    "emporio.policies.infrastructure", "emporio.support.infrastructure",
    "emporio.catalog.domain", "emporio.orders.domain", "emporio.policies.domain",
    "emporio.orders.application", "emporio.policies.application",
    "emporio.entrypoints", "emporio.platform.db", "emporio.platform.migrate",
    "emporio.platform.embeddings", "emporio.platform.local_model",
    "langchain", "langchain_core", "langgraph", "psycopg", "psycopg_pool", "langfuse",
    "langchain_openai", "langchain_anthropic", "langchain_google_genai",
]
# The error-code enums are the one domain module the HTTP maps read.
ignore_imports = [
    "emporio.api.* -> emporio.catalog.domain.errors",
]
