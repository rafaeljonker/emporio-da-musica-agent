<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emporio Chat · galeria de mockups</title>
  <link rel="stylesheet" href="mockup.css">
  <style>
    body { padding: 24px; }
    header.top { max-width: 1400px; margin: 0 auto 24px; }
    header.top h1 { margin: 0 0 4px; font-size: 2rem; }
    section { max-width: 1400px; margin: 0 auto 48px; }
    section h2 { font-size: 1.25rem; margin: 0 0 4px; }
    .views { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; margin-top: 12px; }
    figure { margin: 0; }
    figcaption { font-size: 14px; color: var(--muted-foreground); margin-top: 8px; }
    .phone { width: 390px; height: 844px; border: 10px solid #2a1f17; border-radius: 44px; overflow: hidden; background: #2a1f17; }
    .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; }
    .desk { width: 640px; height: 400px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .desk iframe { width: 1280px; height: 800px; border: 0; transform: scale(.5); transform-origin: 0 0; }
  </style>
</head>
<body>
  <header class="top">
    <h1 class="font-display">Emporio Chat, mockups</h1>
    <p class="muted">Clicáveis e estáticos. Celular 390 × 844 e desktop 1280 × 800 (reduzido a 50%). Abra cada tela sozinha para ver os controles do mockup.</p>
  </header>
  <main id="gallery"></main>
  <script>
    const SCREENS = [
      ["login.html", "1. Login de demonstração", "Wordmark, tagline e card de madeira. O sucesso dispara o aquecimento."],
      ["warmup.html?variant=gpu", "2a. Aquecimento: GPU no Modal", "Etapas reais, tempo decorrido contando pra cima, nenhuma barra de progresso."],
      ["warmup.html?variant=local", "2b. Aquecimento: local sem GPU", "Duas etapas; depois de pronto, aviso discreto fica sob a faixa de demonstração."],
      ["warmup.html?variant=api", "2c. API de provedor", "Sem espera: a conversa abre pronta."],
      ["chat.html?autoplay", "3. Conversa", "Roteiro automático. Métricas num details recolhido na faixa de demonstração: totais da sessão no resumo, histórico por resposta dentro."],
    ];
    document.getElementById("gallery").innerHTML = SCREENS.map(([src, title, note]) => {
      const url = src + (src.includes("?") ? "&" : "?") + "embed";
      return `<section aria-labelledby="h-${title.slice(0, 2)}"><h2 id="h-${title.slice(0, 2)}"><a href="${src}">${title}</a></h2><p class="muted small">${note}</p>
        <div class="views">
          <figure><div class="phone"><iframe src="${url}" title="${title}, celular" loading="lazy"></iframe></div><figcaption>Celular 390 × 844</figcaption></figure>
          <figure><div class="desk"><iframe src="${url}" title="${title}, desktop" loading="lazy" tabindex="-1"></iframe></div><figcaption>Desktop 1280 × 800</figcaption></figure>
        </div></section>`;
    }).join("");
  </script>
</body>
</html>
